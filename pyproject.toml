[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-runtime"
version = "0.1.0"
description = "A reliability boundary for executing agent tools in production backends"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "leodevnc"}]
dependencies = ["jsonschema>=3.2,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]

[project.optional-dependencies]
redis = ["redis>=5,<7"]
dev = [
  "redis>=5,<7",
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["redis: integration tests that require a live Redis server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
